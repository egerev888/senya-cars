<!doctype html>
<html lang="ru">
<head>

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="&#1057;&#1077;&#1085;&#1103; &#1080; &#1084;&#1072;&#1096;&#1080;&#1085;&#1082;&#1080;">

<body>
<canvas id="c"></canvas>
<script src="voice/map.js"></script>
<script>
'use strict';
/* Сеня и машинки (hero was called Тёма before 2026-11-24; internal names drawTema/tema_cars_v1 kept) — original toddler game: build a car from parts, then drive it. Everything is unlocked. */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const VH = 720;
let W = 0, H = 0, DPR = 1, S = 1, VW = 1280;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  S = cv.height / VH; VW = cv.width / S;
}
addEventListener('resize', resize);
resize();

let T = 0, wheelAng = 0, SHOW_DRIVER = false, GHOST = false, GHOST_FILL = 'rgba(255,255,255,0.55)';
const OL = '#263238', GLASS = '#b3e5fc', SKIN = '#ffd3b0', HAIR = '#6d4c41', CAP = '#1e88e5';
const TL = 7000;      // track length
const SY0 = 470;      // screen y of the camera's ground level
const CS = 0.62;      // car scale while driving

/* ---------- save ---------- */
let save = { built: {}, best: {} };
try { const s = JSON.parse(localStorage.getItem('tema_cars_v1')); if (s) save = Object.assign(save, s); } catch (e) {}
function persist() { try { localStorage.setItem('tema_cars_v1', JSON.stringify(save)); } catch (e) {} }

/* ---------- speech ---------- */
let ruVoice = null;
function pickVoice() { try { const vs = speechSynthesis.getVoices(); ruVoice = vs.find(v => /^ru/i.test(v.lang)) || null; } catch (e) {} }
if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
/* Pre-recorded cartoon voice (voice/*.mp3, made by voice-tools/make_voice.py); system TTS is the fallback. */
let voiceAudio = null;
function stopVoice() { if (voiceAudio) { try { voiceAudio.pause(); } catch (e) {} voiceAudio = null; } }
/* Web build (iPhone/Safari, served over http/https): play the mp3 through Web Audio. Safari blocks
   new Audio().play() outside a touch, but an AudioContext unlocked once by a touch keeps working.
   The Android app loads file:///android_asset and keeps the <audio> path below. */
const WEB_AUDIO_VOICE = /^https?:$/.test(location.protocol);
const voiceBuf = {}; let voiceSrc = null, voiceSeq = 0;
function stopWebVoice() { if (voiceSrc) { try { voiceSrc.stop(); } catch (e) {} voiceSrc = null; } }
function sayWeb(t, f) {
  const seq = ++voiceSeq; stopWebVoice();
  const play = buf => {
    if (seq !== voiceSeq || !AC) return;
    const s = AC.createBufferSource(); s.buffer = buf; s.connect(AC.destination); s.start(); voiceSrc = s;
  };
  if (voiceBuf[f]) { play(voiceBuf[f]); return; }
  fetch('voice/' + f).then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); })
    .then(ab => new Promise((ok, bad) => AC.decodeAudioData(ab, ok, bad)))
    .then(buf => { voiceBuf[f] = buf; play(buf); })
    .catch(() => { if (seq === voiceSeq) ttsSay(t); });
}
function say(t) {
  const f = window.VOICE_MAP && VOICE_MAP[t];
  if (f && WEB_AUDIO_VOICE && AC) { sayWeb(t, f); return; }
  if (f) {
    stopVoice();
    try {
      const a = new Audio('voice/' + f); voiceAudio = a;
      const p = a.play();
      if (p && p.catch) p.catch(() => { if (voiceAudio === a) { voiceAudio = null; ttsSay(t); } });
      return;
    } catch (e) {}
  }
  ttsSay(t);
}
function ttsSay(t) {
  try {
    if (window.AndroidApp && AndroidApp.speak) { AndroidApp.speak(t); return; }
    if (window.speechSynthesis) {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(t);
      u.lang = 'ru-RU'; if (ruVoice) u.voice = ruVoice; u.rate = 0.95; u.pitch = 1.15;
      speechSynthesis.speak(u);
    }
  } catch (e) {}
}

/* ---------- audio (synthesised, no files) ---------- */
let AC = null, master = null, engine = null;
function audioInit() {
  if (AC) { if (AC.state !== 'running') AC.resume(); return; }
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {} // iOS 16.4+: play even with the silent switch on
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.6; master.connect(AC.destination);
  } catch (e) { AC = null; }
}
function tone(f, d, type, v, delay, slide) {
  if (!AC) return;
  const t = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + d);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(v || 0.25, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.05);
}
const sfx = {
  tap: () => tone(660, 0.08, 'triangle', 0.2),
  pick: () => tone(440, 0.07, 'triangle', 0.18),
  snap: () => { tone(523, 0.1, 'triangle', 0.3); tone(784, 0.16, 'triangle', 0.3, 0.08); },
  miss: () => tone(260, 0.22, 'sine', 0.25, 0, 0.5),
  star: () => { tone(1046, 0.1, 'square', 0.1); tone(1568, 0.16, 'square', 0.09, 0.06); },
  jump: () => tone(300, 0.25, 'triangle', 0.22, 0, 2.5),
  bump: () => { tone(150, 0.25, 'square', 0.13, 0, 0.5); tone(90, 0.3, 'sine', 0.3); },
  horn: () => { tone(392, 0.35, 'square', 0.11); tone(494, 0.35, 'square', 0.09); },
  done: () => [392, 523, 659, 784].forEach((f, i) => tone(f, 0.2, 'square', 0.1, i * 0.09)),
  win: () => { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.3, 'triangle', 0.25, i * 0.15)); tone(1046, 0.7, 'triangle', 0.25, 0.6); }
};
function engineStart() {
  if (!AC || engine) return;
  try {
    const o = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain();
    o.type = 'sawtooth'; o.frequency.value = 55; f.type = 'lowpass'; f.frequency.value = 380; g.gain.value = 0.045;
    o.connect(f); f.connect(g); g.connect(master); o.start(); engine = { o, g };
  } catch (e) {}
}
function engineSet(sp) { if (engine) engine.o.frequency.setTargetAtTime(42 + sp * 0.12, AC.currentTime, 0.1); }
function engineStop() {
  if (!engine) return;
  try { engine.g.gain.setTargetAtTime(0.0001, AC.currentTime, 0.05); engine.o.stop(AC.currentTime + 0.4); } catch (e) {}
  engine = null;
}
document.addEventListener('visibilitychange', () => {
  if (!AC) return;
  if (document.hidden) { AC.suspend(); stopVoice(); try { speechSynthesis.cancel(); } catch (e) {} } else AC.resume();
});

/* ---------- drawing helpers ---------- */
function paint(fill, lw) {
  if (GHOST) {
    ctx.fillStyle = GHOST_FILL; ctx.fill();
    ctx.setLineDash([9, 7]); ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(55,71,79,0.5)'; ctx.stroke(); ctx.setLineDash([]);
    return;
  }
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (lw) { ctx.lineWidth = lw; ctx.strokeStyle = OL; ctx.lineJoin = 'round'; ctx.stroke(); }
}
function rrPath(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function fillRR(x, y, w, h, r, fill, lw) { rrPath(x, y, w, h, r); paint(fill, lw === undefined ? 5 : lw); }
function poly(p, fill, lw) {
  ctx.beginPath(); ctx.moveTo(p[0], p[1]);
  for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i], p[i + 1]);
  ctx.closePath(); paint(fill, lw === undefined ? 5 : lw);
}
function circle(x, y, r, fill, lw) { ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2); paint(fill, lw === undefined ? 5 : lw); }
function ell(x, y, rx, ry, fill, lw) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, Math.PI * 2); paint(fill, lw === undefined ? 5 : lw); }
function ln(x1, y1, x2, y2, c, lw) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineCap = 'round';
  if (GHOST) { ctx.strokeStyle = 'rgba(55,71,79,0.45)'; ctx.setLineDash([9, 7]); ctx.lineWidth = Math.min(lw, 6); ctx.stroke(); ctx.setLineDash([]); return; }
  ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.stroke();
}
function olLine(x1, y1, x2, y2, c, lw) { if (!GHOST) ln(x1, y1, x2, y2, OL, lw + 8); ln(x1, y1, x2, y2, c, lw); }
function det(fn) { if (!GHOST) fn(); }
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  if (k > 0) { r += (255 - r) * k; g += (255 - g) * k; b += (255 - b) * k; } else { r *= 1 + k; g *= 1 + k; b *= 1 + k; }
  return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
}
function txt(s, x, y, size, color, align) {
  ctx.font = 'bold ' + size + 'px "Trebuchet MS","Comic Sans MS",Roboto,sans-serif';
  ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(3, size * 0.2); ctx.strokeStyle = OL; ctx.strokeText(s, x, y);
  ctx.fillStyle = color || '#fff'; ctx.fillText(s, x, y);
}
function plainTxt(s, x, y, size, color) {
  ctx.font = 'bold ' + size + 'px "Trebuchet MS",Roboto,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function emo(s, x, y, size) {
  ctx.font = size + 'px "Segoe UI Emoji","Noto Color Emoji","Apple Color Emoji",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000'; ctx.fillText(s, x, y);
}
function drawStar(x, y, r, rot, fill, lw) {
  const p = [];
  for (let i = 0; i < 10; i++) {
    const a = rot - Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
    p.push(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  poly(p, fill || '#ffd600', lw === undefined ? 4 : lw);
}
function hr(i) { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- Тёма ---------- */
function drawTemaHead(x, y, r) {
  const G = GHOST; GHOST = false;
  ctx.save(); ctx.translate(x, y);
  const lw = Math.max(2, r * 0.07);
  circle(-r * 0.96, r * 0.08, r * 0.2, SKIN, lw); circle(r * 0.96, r * 0.08, r * 0.2, SKIN, lw);
  circle(0, 0, r, SKIN, lw);
  for (let k = -3; k <= 2; k++) circle(k * r * 0.24 + r * 0.1, -r * 0.36, r * 0.2, HAIR, 0);
  ctx.beginPath(); ctx.arc(0, -r * 0.4, r * 0.9, Math.PI, 0); ctx.closePath(); paint(CAP, lw);
  ell(r * 0.72, -r * 0.42, r * 0.55, r * 0.13, shade(CAP, -0.3), lw);
  circle(0, -r * 1.3, r * 0.1, '#fff', lw * 0.6);
  for (const ex of [-0.33, 0.33]) {
    ell(ex * r, r * 0.1, r * 0.16, r * 0.21, '#fff', lw * 0.7);
    circle(ex * r + r * 0.06, r * 0.13, r * 0.1, OL, 0);
    circle(ex * r + r * 0.09, r * 0.07, r * 0.035, '#fff', 0);
  }
  ctx.globalAlpha = 0.45; circle(-r * 0.58, r * 0.42, r * 0.14, '#ff8a80', 0); circle(r * 0.58, r * 0.42, r * 0.14, '#ff8a80', 0); ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.arc(0, r * 0.33, r * 0.32, 0.18 * Math.PI, 0.82 * Math.PI);
  ctx.lineWidth = lw; ctx.strokeStyle = OL; ctx.lineCap = 'round'; ctx.stroke();
  ctx.restore(); GHOST = G;
}
function arm(x, y, a) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a);
  fillRR(-11, -4, 22, 72, 11, SKIN, 4); circle(0, 72, 13, SKIN, 4);
  ctx.restore();
}
/* pose: 'stand' | 'wave' | 'cheer' ; (x,y) = feet */
function drawTema(x, y, s, pose) {
  ctx.save(); ctx.translate(x, y);
  let jump = 0;
  if (pose === 'cheer') jump = Math.abs(Math.sin(T * 6)) * 30;
  ctx.translate(0, -jump * s); ctx.scale(s, s);
  fillRR(-34, -95, 28, 85, 10, '#1565c0', 4); fillRR(6, -95, 28, 85, 10, '#1565c0', 4);
  fillRR(-44, -18, 42, 22, 11, '#e53935', 4); fillRR(4, -18, 42, 22, 11, '#e53935', 4);
  let aL = 0.3 + Math.sin(T * 3) * 0.05, aR = -0.3 - Math.sin(T * 3) * 0.05;
  if (pose === 'wave') aR = -2.6 + Math.sin(T * 8) * 0.35;
  if (pose === 'cheer') { aL = 2.6 + Math.sin(T * 12) * 0.2; aR = -2.6 - Math.sin(T * 12) * 0.2; }
  fillRR(-54, -190, 108, 108, 28, '#ff9800', 5);
  txt('С', 0, -136, 46, '#fff59d');
  arm(-50, -172, aL); arm(50, -172, aR);
  drawTemaHead(0, -246, 64);
  ctx.restore();
}
/* window with Тёма inside (only when SHOW_DRIVER) */
function driverWin(x, y, w, h, r) {
  fillRR(x, y, w, h, r, GLASS, 4);
  if (SHOW_DRIVER && !GHOST) {
    ctx.save(); rrPath(x, y, w, h, r); ctx.clip();
    drawTemaHead(x + w / 2, y + h * 0.56, Math.min(w, h) * 0.42);
    ctx.restore();
    rrPath(x, y, w, h, r); ctx.lineWidth = 4; ctx.strokeStyle = OL; ctx.stroke();
  }
  det(() => { ctx.globalAlpha = 0.5; ln(x + w * 0.2, y + h * 0.75, x + w * 0.45, y + h * 0.15, '#fff', 4); ctx.globalAlpha = 1; });
}

/* ---------- car parts ---------- */
function P(name, group, x, y, w, h, z, draw) { return { name, group, x, y, w, h, z, draw }; }
function wheelDraw(r) {
  circle(0, 0, r, '#37474f', 5);
  circle(0, 0, r * 0.55, '#cfd8dc', 4);
  det(() => {
    ctx.save(); ctx.rotate(wheelAng * 34 / r);
    for (let k = 0; k < 4; k++) { const a = k * Math.PI / 2; ln(0, 0, Math.cos(a) * r * 0.5, Math.sin(a) * r * 0.5, '#78909c', 4); }
    ctx.restore();
    circle(0, 0, r * 0.16, '#78909c', 3);
  });
}
function wheels(xs, r, name) { r = r || 34; return xs.map(x => P(name || 'Колесо', 'wheel' + r, x, -r, r * 2, r * 2, 10, () => wheelDraw(r))); }
function sedanBody(c, extra) {
  return P('Кузов', 'body', 0, -64, 340, 64, 1, () => {
    fillRR(-170, -32, 340, 64, 30, c);
    det(() => {
      if (extra) extra();
      circle(150, -8, 9, '#fff59d', 3); fillRR(-168, -16, 14, 18, 4, '#e53935', 3);
      ln(-12, -26, -12, 22, shade(c, -0.35), 3); fillRR(10, -8, 22, 7, 3, shade(c, -0.4), 0);
    });
  });
}
function sedanCab(c) {
  return P('Кабина', 'cab', -5, -126, 220, 80, 0, () => {
    poly([-110, 40, -72, -40, 62, -40, 110, 40], c);
    poly([-86, 34, -60, -26, -10, -26, -10, 34], GLASS, 4);
    driverWin(4, -28, 54, 62, 8);
  });
}
function sirenPart(x, y) {
  return P('Мигалка', 'siren', x, y, 72, 28, 0, () => {
    const b = Math.floor(T * 5) % 2 === 0;
    fillRR(-36, -14, 37, 28, 9, b ? '#ff1744' : '#b71c1c');
    fillRR(-1, -14, 37, 28, 9, b ? '#0d47a1' : '#448aff');
  });
}
function chassis() {
  return P('Рама', 'chassis', 0, -62, 390, 36, 1, () => {
    fillRR(-195, -18, 390, 36, 10, '#546e7a');
    det(() => fillRR(-190, -8, 24, 14, 4, '#e53935', 3));
  });
}
function truckCab(c, x, y) {
  return P('Кабина', 'cab', x, y, 120, 116, 2, () => {
    fillRR(-60, -58, 120, 116, 18, c);
    driverWin(-6, -46, 54, 50, 10);
    det(() => { ln(-14, -50, -14, 50, shade(c, -0.35), 3); circle(50, 36, 8, '#fff59d', 3); fillRR(-40, 10, 18, 6, 3, shade(c, -0.45), 0); });
  });
}
function vanBody(c, deco) {
  return P('Кузов', 'body', 0, -112, 360, 150, 1, () => {
    fillRR(-180, -75, 360, 150, 22, c);
    driverWin(104, -58, 62, 58, 12);
    det(() => { if (deco) deco(); circle(170, 42, 8, '#fff59d', 3); });
  });
}
/* v1.4 small extra parts (more pieces per vehicle). Groups carry the size so only matching slots accept a part. */
function lampPart(x, y) { return P('Фара', 'lamp', x, y, 32, 32, 6, () => { circle(0, 0, 14, '#fff59d', 4); det(() => circle(-4, -4, 4, '#fff', 0)); }); }
function bumperPart(x, y, w) { return P('Бампер', 'bumper' + w, x, y, w, 18, 6, () => fillRR(-w / 2, -9, w, 18, 9, '#90a4ae', 4)); }
function mirrorPart(x, y) { return P('Зеркало', 'mirror', x, y, 28, 40, 6, () => { fillRR(-3, 2, 6, 18, 3, '#455a64', 3); fillRR(-13, -18, 26, 22, 7, GLASS, 4); }); }
function exhaustPart(x, y) {
  return P('Выхлопная труба', 'exhaust', x, y, 44, 18, 0, () => {
    det(() => { if (wheelAng) { ctx.globalAlpha = 0.5; for (let k = 0; k < 3; k++) { const t = (T * 0.9 + k / 3) % 1; circle(-26 - t * 50, -t * 20, 6 + t * 12, '#cfd8dc', 0); } ctx.globalAlpha = 1; } });
    fillRR(-22, -8, 44, 16, 7, '#b0bec5', 4);
  });
}
function beaconPart(x, y) { return P('Мигалка', 'beacon', x, y, 40, 30, 0, () => { const b = Math.floor(T * 4) % 2 === 0; fillRR(-20, -15, 40, 30, 12, b ? '#ffb300' : '#ff6f00'); }); }
function antennaPart(x, y) { return P('Антенна', 'antenna', x, y, 24, 60, 0, () => { fillRR(-3, -28, 6, 58, 3, '#546e7a', 3); circle(0, -28, 8, '#e53935', 3); }); }
function flagPart(x, y, c) { return P('Флажок', 'flag2', x, y, 56, 70, 0, () => { fillRR(-26, -35, 6, 70, 3, '#6d4c41', 3); poly([-21, -33, 26 + Math.sin(T * 6) * 3, -20, -21, -6], c || '#e53935', 4); }); }
function anchorPart(x, y) {
  return P('Якорь', 'anchor', x, y, 50, 56, 3, () => {
    fillRR(-4, -20, 8, 44, 3, '#455a64', 3); fillRR(-14, -16, 28, 7, 3, '#455a64', 3); circle(0, -24, 7, '#455a64', 3);
    ctx.beginPath(); ctx.arc(0, 4, 20, 0.15 * Math.PI, 0.85 * Math.PI); if (GHOST) { ctx.setLineDash([9, 7]); ctx.strokeStyle = 'rgba(55,71,79,0.5)'; ctx.lineWidth = 4; ctx.stroke(); ctx.setLineDash([]); } else { ctx.strokeStyle = OL; ctx.lineWidth = 13; ctx.stroke(); ctx.strokeStyle = '#455a64'; ctx.lineWidth = 7; ctx.stroke(); }
  });
}
function ringPart(x, y) {
  return P('Спасательный круг', 'ring', x, y, 56, 56, 2, () => {
    circle(0, 0, 27, '#ff7043');
    det(() => { ctx.lineWidth = 12; ctx.strokeStyle = '#fff'; for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.arc(0, 0, 20, k * Math.PI / 2, k * Math.PI / 2 + 0.6); ctx.stroke(); } circle(0, 0, 11, '#90caf9', 4); });
  });
}
function stabPart(x, y, c) { return P('Маленькое крыло', 'stab', x, y, 100, 24, 2, () => poly([-50, -8, 30, -8, 50, 10, -44, 10], c)); }
/* land extras: front lamp, two bumpers, mirror, exhaust (positions in car coordinates) */
function kit(o) {
  const a = [];
  if (o.lamp) a.push(lampPart(o.lamp[0], o.lamp[1]));
  if (o.bf) a.push(bumperPart(o.bf[0], o.bf[1], o.bw || 44));

    if (s.got) continue; const sx = s.x - D.camX; if (sx < -60 || sx > VW + 60) continue;
    const sy = ground(s.x) - s.h - D.camY + SY0 + Math.sin(T * 4 + s.x) * 5;
    drawStar(sx, sy, 26 + Math.sin(T * 6 + s.x) * 2, Math.sin(T * 2 + s.x) * 0.3, '#ffd600', 4);
  }
  // car
  const shake = D.bump > 0 ? Math.sin(T * 70) * 14 * D.bump : 0;
  const cx = D.x - D.camX + shake, cyS = D.y - D.camY + SY0 + (W8 ? 12 + (D.on ? Math.sin(T * 3) * 3 : 0) : 0);
  if (D.mode === 'a') { const gs = ground(D.x) - D.camY + SY0 + 8, k = Math.max(0.3, 1 - D.alt / 450); ell(cx, gs, D.car.wid * CS * 0.4 * k, 9 * k, 'rgba(0,0,0,0.18)', 0); }
  if (tr.deco === 'night') {
    ctx.save(); ctx.translate(cx, cyS); ctx.rotate(D.ang);
    const lx = (D.car.maxX - D.car.midX) * CS, g = ctx.createLinearGradient(lx, 0, lx + 320, 0);
    g.addColorStop(0, 'rgba(255,245,157,0.55)'); g.addColorStop(1, 'rgba(255,245,157,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(lx - 10, -30); ctx.lineTo(lx + 320, -110); ctx.lineTo(lx + 320, 40); ctx.closePath(); ctx.fill(); ctx.restore();
  }
  if (D.turbo && (D.on || D.mode === 'a')) { const py = cyS - (D.mode === 'a' ? 50 : 12); ctx.globalAlpha = 0.5; for (let k = 0; k < 3; k++) circle(cx - D.car.wid * CS / 2 - 20 - k * 26 - (T * 200 % 26), py - k * 4, 12 + k * 4, '#eeeeee', 0); ctx.globalAlpha = 1; }
  drawCar(D.car, cx, cyS, CS, D.ang + (D.bump > 0 ? Math.sin(T * 50) * 0.12 * D.bump : 0), true);
  if (W8) { ctx.globalAlpha = 0.8; surf(tr.water, 16); ctx.globalAlpha = 1; }
  if (D.horn > 0) { fillRR(cx - 75, cyS - D.car.hei * CS - 90, 150, 56, 20, '#fff', 4); txt(HORN[D.mode] + '!', cx, cyS - D.car.hei * CS - 62, 30, '#e53935'); }
  // hint for the next obstacle: tap (land/water) or hold / let go (air)
  if (!D.fin) {
    const o = D.obs.find(q => !q.hit && q.x - D.x > 120 && q.x - D.x < 430);
    const bob = Math.sin(T * 8) * 10, hy = cyS - D.car.hei * CS - 50 + bob;
    if (o && D.mode !== 'a' && D.on) emo('👆', cx + 40, hy, 60);
    if (o && D.mode === 'a' && Math.abs(D.alt + 40 - o.hi) < 110) emo(o.hi < 170 ? '⬆️' : '⬇️', cx + 60, o.hi < 170 ? hy : cyS + 40 + bob, 60);
  }
  drawParts();
  if (tr.deco === 'winter') { ctx.fillStyle = '#fff'; for (let i = 0; i < 70; i++) { const x = (i * 137.3 + T * 30 * (1 + i % 3) - D.camX * 0.3) % VW, y = (i * 89.7 + T * 70 * (1 + i % 2)) % VH; ctx.beginPath(); ctx.arc((x + VW) % VW, y, 3 + i % 3, 0, 7); ctx.fill(); } }
  // HUD
  homeBtn();
  const bx0 = VW * 0.3, bx1 = VW * 0.7; fillRR(bx0, 46, bx1 - bx0, 16, 8, 'rgba(255,255,255,0.7)', 3);
  const pr = Math.min(1, D.x / TL); fillRR(bx0, 46, Math.max(16, (bx1 - bx0) * pr), 16, 8, '#66bb6a', 0);
  emo('🏁', bx1 + 26, 52, 34); circle(bx0 + (bx1 - bx0) * pr, 54, 16, D.car.c, 4);
  drawStar(VW - 150, 60, 28, 0, '#ffd600', 4); txt(String(D.got), VW - 110, 62, 44, '#fff', 'left');
  if (!D.fin) {
    circle(105, 615, 72, '#ffca28', 6); txt(HORN[D.mode], 105, 617, 30, '#fff');
    circle(VW - 110, 612, 78, D.turbo ? '#2e7d32' : '#43a047', 6);
    const tx = VW - 110; poly([tx - 40, 582, tx - 40, 642, tx - 2, 612], '#fff', 0); poly([tx + 2, 582, tx + 2, 642, tx + 40, 612], '#fff', 0);
  }
  if (D.shown) {
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(0, 0, VW, VH);
    const pw = Math.min(800, VW - 60), ph = 470, px = (VW - pw) / 2, py = 125;
    fillRR(px, py, pw, ph, 36, '#fffde7', 6);
    drawTema(px + 115, py + ph - 40, 0.95, 'cheer');
    txt('Ура! Приехали!', px + pw / 2 + 80, py + 70, Math.min(58, pw / 12), '#ff7043');
    drawStar(px + pw / 2 + 20, py + 165, 44, Math.sin(T * 3) * 0.2, '#ffd600', 5);
    txt(D.got + ' из ' + D.total, px + pw / 2 + 80, py + 168, 52, '#fff', 'left');
    const items = [['🔄', 'Ещё', () => startDrive(D.ti)], ['🛣️', 'Дорога', () => { scene = 'tracks'; }], ['🚗', 'Машинки', () => { scene = 'cars'; }]];
    const bw = (pw - 260) / 3;
    items.forEach((it, k) => {
      const x = px + 240 + bw * (k + 0.5), y = py + 320;
      circle(x, y, 58, ['#4fc3f7', '#aed581', '#ffb74d'][k], 5); emo(it[0], x, y + 2, 54);
      plainTxt(it[1], x, y + 88, 28, OL);
      btnC(x, y, 64, () => { sfx.tap(); it[2](); });
    });
  }
}
function driveDown(p, id) {
  if (D.fin) return;
  if (Math.hypot(p.x - (VW - 110), p.y - 612) < 90) { D.turbo = true; D.tid = id; sfx.tap(); return; }
  if (Math.hypot(p.x - 105, p.y - 615) < 85) { if (D.mode === 'w') { tone(196, 0.6, 'square', 0.12); tone(247, 0.6, 'square', 0.08); } else if (D.mode === 'a') tone(500, 0.4, 'sawtooth', 0.08, 0, 2); else sfx.horn(); D.horn = 0.8; return; }
  if (D.mode === 'a') { D.lift = true; D.lid = id; return; }
  if (D.on) { D.vy = -950; D.on = false; sfx.jump(); }
}
function driveUp(p, id) { if (id === D.tid) { D.turbo = false; D.tid = null; } if (id === D.lid) { D.lift = false; D.lid = null; } }

/* ---------- input ---------- */
function toV(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * DPR / S, y: (e.clientY - r.top) * DPR / S }; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audioInit();
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  const p = toV(e);
  if ((scene === 'title' || scene === 'cars') && EXIT.x && Math.hypot(p.x - EXIT.x, p.y - EXIT.y) < EXIT.r + 12) { exitHold = { id: e.pointerId, t: 0 }; return; }
  if (hitBtn(p)) return;
  if (scene === 'build') buildDown(p, e.pointerId);
  else if (scene === 'drive') driveDown(p, e.pointerId);
});
cv.addEventListener('pointermove', e => { const p = toV(e); if (scene === 'build') buildMove(p, e.pointerId); });
function up(e) {
  if (e.type === 'pointerup') audioInit(); // Safari unlocks audio on touchend, not touchstart
  const p = toV(e);
  if (exitHold && exitHold.id === e.pointerId) exitHold = null;
  if (scene === 'build') buildUp(p, e.pointerId);
  else if (scene === 'drive') driveUp(p, e.pointerId);
}
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', up);
cv.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- loop ---------- */
function update(dt) {
  T += dt;
  if (exitHold) { exitHold.t += dt; if (exitHold.t >= 2) exitApp(); }
  if (scene === 'build') updBuild(dt);
  else if (scene === 'drive') updDrive(dt);
  updParts(dt);
}
function draw() {
  ctx.setTransform(S, 0, 0, S, 0, 0);
  btns = [];
  if (H > W) { // phone held upright (web build on iPhone; the Android app is locked to landscape)
    ctx.fillStyle = '#6ec6ff'; ctx.fillRect(0, 0, VW, VH);
    ctx.save(); ctx.translate(VW / 2, 300); ctx.rotate(Math.sin(T * 2) > 0 ? -Math.PI / 2 : 0); emo('📱', 0, 0, 150); ctx.restore();
    const fs = Math.min(48, VW / 7);
    plainTxt('Поверни', VW / 2, 450, fs, OL); plainTxt('телефон', VW / 2, 450 + fs * 1.15, fs, OL);
    drawTemaHead(VW / 2, 635, 52);
    return;
  }
  if (scene === 'title') drawTitle();
  else if (scene === 'cars') drawCars();
  else if (scene === 'build') drawBuild();
  else if (scene === 'tracks') drawTracks();
  else if (scene === 'drive') drawDrive();
  if (scene !== 'drive') drawParts();
}
let last = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
  if (innerWidth !== W || innerHeight !== H || Math.min(window.devicePixelRatio || 1, 2) !== DPR) resize();
  if (scene !== 'drive' && scene !== 'build') wheelAng = 0;
  if (H > W) T += dt; else update(dt); // pause the game while the phone is upright
  draw(); requestAnimationFrame(frame);
}

/* debug / screenshot hook: #s=build&c=3&place=2&ff=1 or #s=drive&c=5&t=4&ff=8&turbo=1 */
(function debugInit() {
  const h = location.hash.slice(1); if (!h) return;
  const q = {}; h.split('&').forEach(kv => { const a = kv.split('='); q[a[0]] = a[1]; });
  curCar = +q.c || 0; cat = q.cat || CARS[curCar].k;
  if (q.s === 'cars' || q.s === 'tracks') scene = q.s;
  if (q.s === 'build') {
    startBuild(curCar);
    for (let i = 0; i < (+q.place || 0); i++) { const hnt = nextHint(); if (hnt) placePart(hnt.p, hnt.j); }
    if (q.idle) B.idle = 10;
  }
  if (q.s === 'drive') { startDrive(+q.t || 0); if (q.turbo) D.turbo = true; if (q.lift) D.lift = true; }
  const ff = +q.ff || 0;
  for (let i = 0; i < ff * 60; i++) { if (scene === 'drive' && q.jump && D.on && D.mode !== 'a' && i % 50 === 0) { D.vy = -950; D.on = false; } update(1 / 60); }})();
requestAnimationFrame(frame);
</script>
